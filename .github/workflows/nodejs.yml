name: Node-CI

on:
  push:
    branches: master
  pull_request:
  release:
    types: [released]

jobs:
  build:

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm install and build
        run: |
          npm ci
          npm run build
        env:
          CI: true

  publish-npm:
    if: github.repository == 'MaddogWarner/homebridge-tp-link-powerline-mdw' && github.event_name == 'release'

    needs: build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
