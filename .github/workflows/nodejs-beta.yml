name: Node-CI Beta

on:
  push:
    branches: beta

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm install and build
        run: |
          npm ci
          npm run build
        env:
          CI: true

  publish-npm:
    if: github.repository == 'MaddogWarner/homebridge-tp-link-powerline-mdw'

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Remove placeholder auth token so npm uses OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d; /always-auth/d' "$npmrc"
      - run: npm ci
      - run: npm --no-git-tag-version version pre --preid=beta
      - run: npm publish --tag=beta --access public
